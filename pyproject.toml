[project]
name = "fashion-classifier"
version = "0.7.0"
description = "Fashion-MNIST clothing category recognition: handcrafted-feature baselines vs a small CNN, with a Gradio demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26.4,<2",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "scikit-image>=0.22,<1",
    "matplotlib>=3.8,<4",
    "pillow>=10,<13",
    "joblib>=1.3",
    "threadpoolctl>=3",
    # Intel macOS has no wheels for current PyTorch; it keeps the legacy pair (NumPy must stay below 2).
    "torch>=2.6,<3 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.21,<1 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.17.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "gradio>=5,<7",
    "httpx[socks]>=0.28,<1", # Support environments with a SOCKS proxy
]

[dependency-groups]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5,<6"]
dev = ["pytest>=8,<10"]

[tool.uv]
# Scripts and modules run from the project root (python -m src.train); nothing is packaged.
package = false
default-groups = ["notebook", "dev"]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

# Linux (Docker) uses CPU-only PyTorch wheels; macOS uses PyPI wheels, which include MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
